<section class="content-grid">
    <section class="panel">
        <div class="panel-head">
            <div>
                <p class="eyebrow">My Orders</p>
                <h2>我的订单</h2>
            </div>
            <span id="order-count" class="badge">登录后加载</span>
        </div>
        <div class="panel-banner">
            <img src="/assets/img/product-badge.svg" alt="订单管理标识">
            <p>订单数据仅通过当前登录用户的 Token 查询。待处理订单可以确认或取消，取消后库存会由后端事务自动恢复。</p>
        </div>
        <div class="table-wrap">
            <table class="product-table">
                <thead><tr><th>订单 ID</th><th>商品 ID</th><th>数量</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="order-table-body"><tr><td colspan="5" class="empty-row">请先登录以加载订单。</td></tr></tbody>
            </table>
        </div>
    </section>
    <aside class="panel edit-panel">
        <div class="panel-head"><div><p class="eyebrow">Create Order</p><h2>创建订单</h2></div></div>
        <form id="order-create-form" class="product-form" method="post" action="/order/create">
            <label><span>商品</span><select id="order-product-id" name="productID" required><option value="">登录后加载商品</option></select></label>
            <label><span>购买数量</span><input type="number" name="quantity" min="1" value="1" required></label>
            <input type="hidden" name="userID" id="order-user-id">
            <input type="hidden" name="orderStatus" value="0">
            <div class="form-actions"><button class="submit-btn" type="submit">创建待处理订单</button></div>
            <p id="order-create-message" class="form-message"></p>
        </form>
        <div class="product-form form-separator">
            <p class="form-message">每次下单自动生成独立幂等键；同一次请求重试不会重复扣库存。</p>
            <button id="order-refresh" class="action-btn" type="button">刷新订单</button>
        </div>
    </aside>
</section>
