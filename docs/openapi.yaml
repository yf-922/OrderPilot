openapi: 3.0.3
info:
  title: GoWorks Product API
  version: 1.1.0
  description: Product inventory and transactional order APIs.
servers:
  - url: http://localhost:8080
tags:
  - name: system
  - name: users
  - name: products
  - name: orders
paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      responses: {'200': {description: Process is alive}}
  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      responses: {'200': {description: MySQL is reachable}, '503': {description: Dependency unavailable}}
  /user/login:
    post:
      tags: [users]
      summary: Login and issue an expiring bearer token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, format: password, minLength: 6}
      responses: {'200': {description: Login succeeded}, '400': {description: Invalid request}, '401': {description: Invalid credentials}}
  /user/create:
    post:
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/UserWrite'}
      responses: {'200': {description: User created}, '400': {description: Invalid request or password length}, '409': {description: Username already exists}}
  /user/{id}:
    get:
      tags: [users]
      security: [{bearerAuth: []}]
      summary: Get the authenticated user's profile
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: User profile}, '401': {description: Missing or invalid token}, '403': {description: Another user's profile}, '404': {description: User not found}}
  /user/update:
    post:
      tags: [users]
      security: [{bearerAuth: []}]
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - {$ref: '#/components/schemas/UserWrite'}
                - type: object
                  required: [id]
                  properties: {id: {type: integer, format: int64, minimum: 1}}
      responses: {'200': {description: User updated}, '400': {description: Invalid request or password length}, '401': {description: Missing or invalid token}, '403': {description: Another user's profile}, '404': {description: User not found}, '409': {description: Username already exists}}
  /user/delete:
    post:
      tags: [users]
      security: [{bearerAuth: []}]
      summary: Delete the authenticated user's account
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {type: object, required: [id], properties: {id: {type: integer, format: int64, minimum: 1}}}
      responses: {'200': {description: User deleted}, '400': {description: Invalid ID}, '401': {description: Missing or invalid token}, '403': {description: Another user's account}, '404': {description: User not found}, '409': {description: User has orders}}
  /product/list:
    get:
      tags: [products]
      security: [{bearerAuth: []}]
      summary: Search products with pagination
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: keyword, schema: {type: string}}
      responses: {'200': {description: Paginated products}, '401': {description: Missing or invalid token}}
  /product/{id}:
    get:
      tags: [products]
      security: [{bearerAuth: []}]
      summary: Get a product
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Product found}, '401': {description: Missing or invalid token}, '404': {description: Product not found}}
  /product/create:
    post:
      tags: [products]
      security: [{bearerAuth: []}]
      summary: Create a product
      requestBody:
        required: true
        content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/ProductWrite'}}}
      responses: {'200': {description: Product created}, '400': {description: Invalid request}, '401': {description: Missing or invalid token}}
  /product/update:
    post:
      tags: [products]
      security: [{bearerAuth: []}]
      summary: Update a product
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ProductWrite'}
                - type: object
                  required: [id]
                  properties: {id: {type: integer, format: int64, minimum: 1}}
      responses: {'200': {description: Product updated}, '400': {description: Invalid request}, '401': {description: Missing or invalid token}, '404': {description: Product not found}}
  /product/delete:
    post:
      tags: [products]
      security: [{bearerAuth: []}]
      summary: Delete a product
      requestBody:
        required: true
        content: {application/x-www-form-urlencoded: {schema: {type: object, required: [id], properties: {id: {type: integer, format: int64, minimum: 1}}}}}
      responses: {'200': {description: Product deleted}, '400': {description: Invalid ID}, '401': {description: Missing or invalid token}, '404': {description: Product not found}, '409': {description: Product has orders}}
  /order/list:
    get:
      tags: [orders]
      security: [{bearerAuth: []}]
      summary: List only the authenticated user's orders
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Paginated orders}, '401': {description: Missing or invalid token}}
  /order/{id}:
    get:
      tags: [orders]
      security: [{bearerAuth: []}]
      summary: Get one owned order
      parameters: [{$ref: '#/components/parameters/ID'}]
      responses: {'200': {description: Order found}, '401': {description: Missing or invalid token}, '404': {description: Order not found}}
  /order/create:
    post:
      tags: [orders]
      security: [{bearerAuth: []}]
      summary: Create an order atomically and deduct inventory
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/OrderWrite'}}}
      responses: {'200': {description: Order created or safe idempotent retry}, '400': {description: Invalid request}, '401': {description: Missing or invalid token}, '403': {description: User ID does not match token}, '404': {description: User or product not found}, '409': {description: Insufficient inventory or idempotency conflict}}
  /order/update:
    post:
      tags: [orders]
      security: [{bearerAuth: []}]
      summary: Move an owned order from pending to success
      requestBody:
        required: true
        content: {application/x-www-form-urlencoded: {schema: {type: object, required: [id, orderStatus], properties: {id: {type: integer, format: int64, minimum: 1}, orderStatus: {type: integer, enum: [1]}}}}}
      responses: {'200': {description: Status updated}, '400': {description: Invalid request}, '401': {description: Missing or invalid token}, '409': {description: Invalid state transition}}
  /order/delete:
    post:
      tags: [orders]
      security: [{bearerAuth: []}]
      summary: Cancel an owned pending order and restore inventory
      requestBody:
        required: true
        content: {application/x-www-form-urlencoded: {schema: {type: object, required: [id], properties: {id: {type: integer, format: int64, minimum: 1}}}}}
      responses: {'200': {description: Order cancelled and stock restored}, '401': {description: Missing or invalid token}, '404': {description: Order not found}, '409': {description: Order is already terminal}}
components:
  parameters:
    ID: {in: path, name: id, required: true, schema: {type: integer, format: int64, minimum: 1}}
    IdempotencyKey: {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    UserWrite:
      type: object
      required: [nickName, userName, password]
      properties:
        nickName: {type: string, minLength: 1, maxLength: 64}
        userName: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, format: password, minLength: 6}
    ProductWrite:
      type: object
      required: [productName, productNum, productImage, productUrl]
      properties:
        productName: {type: string, minLength: 1, maxLength: 160}
        productNum: {type: integer, format: int64, minimum: 0}
        productImage: {type: string, format: uri}
        productUrl: {type: string, format: uri}
    OrderWrite:
      type: object
      required: [userID, productID, quantity, orderStatus]
      properties:
        userID: {type: integer, format: int64, minimum: 1}
        productID: {type: integer, format: int64, minimum: 1}
        quantity: {type: integer, format: int64, minimum: 1}
        orderStatus: {type: integer, enum: [0]}
