<svg xmlns="http://www.w3.org/2000/svg" width="760" height="836" viewBox="0 0 760 836" role="img" aria-labelledby="title desc">
  <title id="title">客服请求处理流程</title>
  <desc id="desc">用户消息经过鉴权、状态加载与 Go 规则路由。确定性分支直接处理后回复；其他请求经过上下文压缩进入主模型。主模型可以直接回复，也可以请求 Go 校验并执行工具，更新状态后重新构建上下文。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #172b4d; font-size: 20px; text-anchor: middle; }
      .node { fill: #f0f6ff; stroke: #4777bd; stroke-width: 1.5; }
      .green { fill: #edf9f2; stroke: #34835a; }
      .route { fill: #fff6e5; stroke: #b78327; }
      .edge { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
      .label { font-size: 18px; fill: #475569; }
      .note { font-size: 17px; fill: #475569; }
    </style>
  </defs>
  <rect width="760" height="836" rx="12" fill="#ffffff"/>

  <path class="edge" d="M380 72 V100"/>
  <path class="edge" d="M380 164 V192"/>
  <path class="edge" d="M380 248 V276 H175 V320"/>
  <path class="edge" d="M380 276 H565 V320"/>
  <path class="edge" d="M175 410 V686"/>
  <path class="edge" d="M565 410 V450"/>
  <path class="edge" d="M565 506 V566"/>
  <path class="edge" d="M470 478 H350 V718 H310"/>
  <path class="edge" d="M565 646 V686"/>
  <path class="edge" d="M700 718 H734 V365 H700"/>

  <rect class="node" x="260" y="24" width="240" height="48" rx="9"/>
  <text x="380" y="55">用户消息</text>

  <rect class="node" x="260" y="100" width="240" height="64" rx="9"/>
  <text x="380" y="126"><tspan x="380">身份鉴权</tspan><tspan x="380" dy="26">加载会话状态</tspan></text>

  <rect class="node route" x="260" y="192" width="240" height="56" rx="9"/>
  <text x="380" y="227">Go 前置规则路由</text>

  <rect x="90" y="280" width="170" height="25" fill="#ffffff"/>
  <rect x="495" y="280" width="140" height="25" fill="#ffffff"/>
  <text class="label" x="175" y="300">可直接处理</text>
  <text class="label" x="565" y="300">需要模型</text>

  <rect class="node green" x="40" y="320" width="270" height="90" rx="9"/>
  <text x="175" y="355"><tspan x="175">确定性处理</tspan><tspan x="175" dy="29">确认 / 拒止 / 人工交接</tspan></text>

  <rect class="node" x="430" y="320" width="270" height="90" rx="9"/>
  <text x="565" y="355"><tspan x="565">三级上下文压缩</tspan><tspan x="565" dy="29">收敛可用工具</tspan></text>

  <rect class="node" x="470" y="450" width="190" height="56" rx="9"/>
  <text x="565" y="485">主模型</text>

  <rect x="309" y="514" width="83" height="28" fill="#ffffff"/>
  <text class="label" x="350" y="534">文字回复</text>
  <text class="label" x="565" y="544">请求调用工具</text>

  <rect class="node" x="430" y="566" width="270" height="80" rx="9"/>
  <text x="565" y="598"><tspan x="565">Go 校验并执行工具</tspan><tspan x="565" dy="28">订单 / 商品 / 知识检索</tspan></text>

  <rect class="node green" x="430" y="686" width="270" height="64" rx="9"/>
  <text x="565" y="712"><tspan x="565">更新会话状态</tspan><tspan x="565" dy="26">追加工具结果</tspan></text>

  <rect class="node green" x="40" y="686" width="270" height="64" rx="9"/>
  <text x="175" y="725">保存会话并回复</text>

  <text class="note" x="380" y="798">右侧回路：工具执行后，重新组装上下文并请求主模型。</text>
  <text class="note" x="380" y="823">模型提出调用请求；Go 后端负责校验与实际执行。</text>
</svg>
