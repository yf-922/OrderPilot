name: API Smoke Checks

on:
  push:
  pull_request:

jobs:
  static-and-test-assets:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: local
      JEV_EXTERNAL_ENABLED: "false"
      AGENT_TOKENIZER_URL: http://127.0.0.1:8091
      AGENT_TOKEN_ENCODING: cl100k_base
      AGENT_ABLATION_REPORT_PATH: ../docs/local-verification-ablation.md
      AGENT_EXPANDED_REPORT_PATH: ../docs/context-expanded-offline-report.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Go module proxy
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: go env -w GOPROXY=$GOPROXY

      - name: Verify Go modules
        run: go mod download

      - name: Build backend
        run: go build ./...

      # Context evaluation is a Go test but depends on the Python tokenizer.
      # Install and warm it before the first test, not after static analysis.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-context.txt

      - name: Install and warm context tokenizer
        run: |
          python -m pip install -r tests/requirements-context.txt
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"

      - name: Start and verify local tokenizer
        shell: bash
        run: |
          python tokenizer/server.py > "$RUNNER_TEMP/agent-tokenizer.log" 2>&1 &
          echo "AGENT_TOKENIZER_PID=$!" >> "$GITHUB_ENV"
          python - <<'PY'
          import json
          import time
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8091/v1/count",
              data=json.dumps({"encoding": "cl100k_base", "messages": [], "tools": []}).encode(),
              headers={"Content-Type": "application/json"},
          )
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      result = json.load(response)
                  assert result["encoding"] == "cl100k_base" and result["tokens"] > 0, result
                  print("Tokenizer count endpoint ready:", result)
                  break
              except (OSError, AssertionError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Run Go tests
        run: go test ./...

      - name: Run fixed Agent golden set (5 repetitions)
        run: go test ./agent -run '^TestAgentGoldenEvaluation$' -count=1 -v

      - name: Run scripted Agent trajectory and fault set (5 repetitions)
        run: go test ./agent -run '^TestAgentTrajectoryEvaluation$' -count=1

      - name: Run race detector
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Install static analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run static analysis and vulnerability scan
        shell: bash
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run Go formatter check
        shell: bash
        run: test -z "$(gofmt -l agent backend common datamodels repositories services tests)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check API smoke test syntax
        run: python -m py_compile tests/api_smoke_test.py

      - name: Test Agent report comparison
        run: python -m unittest discover -s tests -p test_compare_agent_eval.py

      - name: Start integration environment
        run: docker compose up -d --build --wait

      - name: Run database concurrency integration test
        env:
          INTEGRATION_TEST: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: product
        run: go test ./tests -run TestConcurrentOrdersDoNotOversell -v

      - name: Run pgvector database integration test
        env:
          PGVECTOR_TEST_DSN: postgres://rag:rag@127.0.0.1:5432/rag?sslmode=disable
        run: go test ./agent -run '^TestPgvectorDatabaseRoundTrip$' -count=1 -v

      - name: Run HTTP API smoke tests
        run: python tests/api_smoke_test.py

      - name: Run Agent browser workflow
        run: npm run test:e2e

      - name: Upload browser traces after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Show tokenizer log after failure
        if: failure()
        run: cat "$RUNNER_TEMP/agent-tokenizer.log" || true

      - name: Stop local tokenizer
        if: always()
        shell: bash
        run: |
          if [ -n "${AGENT_TOKENIZER_PID:-}" ]; then
            kill "$AGENT_TOKENIZER_PID" 2>/dev/null || true
          fi

      - name: Stop integration environment
        if: always()
        run: docker compose down -v
